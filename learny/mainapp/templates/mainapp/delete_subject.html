{% extends 'mainapp/base.html' %}
{% block title %}Delete Subject{% endblock %}
{% block page_heading %}Delete Subject{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
    <div class="modern-card border-red-200 p-8">
        <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-red-100 text-red-600">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 class="font-display mt-4 text-2xl font-bold text-slate-900">Delete Subject</h2>
        <p class="mt-2 text-sm text-slate-600">Are you sure you want to delete <span class="font-semibold text-slate-900">{{ subject.name }}</span>? This action cannot be undone.</p>
        <form method="post" class="mt-6 flex flex-wrap gap-3">
            {% csrf_token %}
            <button type="submit" class="btn-danger-modern"><i class="fa-solid fa-trash"></i>Delete</button>
            <a href="{% url 'teacher_dashboard' %}" class="btn-ghost-modern">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
