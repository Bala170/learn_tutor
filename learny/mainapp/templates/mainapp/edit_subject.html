{% extends 'mainapp/base.html' %}
{% block title %}Edit Subject{% endblock %}
{% block page_heading %}Edit Subject{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
    <div class="modern-card p-8">
        <h2 class="font-display text-2xl font-bold text-slate-900">Update Subject</h2>
        <p class="mt-2 text-sm text-slate-600">Edit the subject details and keep your curriculum up to date.</p>
        <form method="post" class="mt-7">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-5 flex flex-wrap gap-3">
                <button type="submit" class="btn-primary-modern"><i class="fa-solid fa-floppy-disk"></i>Save Changes</button>
                <a href="{% url 'teacher_dashboard' %}" class="btn-ghost-modern">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
